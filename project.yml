name: IconSetter
options:
  bundleIdPrefix: com.n14395
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  IconSetter:
    type: application
    platform: macOS
    sources:
      - path: IconSetter
        excludes:
          - Info.plist
    info:
      path: IconSetter/Info.plist
      properties:
        CFBundleName: Icon Setter
        CFBundleDisplayName: Icon Setter
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: "Copyright © 2026 nwf"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        NSServices:
          - NSMenuItem:
              default: "Set Custom Icon…"
            NSMessage: setCustomIcon
            NSPortName: Icon Setter
            NSSendFileTypes:
              - public.item
        CFBundleDocumentTypes:
          - CFBundleTypeName: Folder
            CFBundleTypeRole: Viewer
            LSHandlerRank: None
            LSItemContentTypes:
              - public.folder
          - CFBundleTypeName: Item
            CFBundleTypeRole: Viewer
            LSHandlerRank: None
            LSItemContentTypes:
              - public.item
    settings:
      base:
        MARKETING_VERSION: "0.2"
        PRODUCT_BUNDLE_IDENTIFIER: com.n14395.icon-setter
        PRODUCT_NAME: Icon Setter
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
